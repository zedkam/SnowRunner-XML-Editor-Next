name: Fix beta release metadata

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  mark-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Mark v2.0.0-beta.1 as prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit v2.0.0-beta.1 --repo "$GITHUB_REPOSITORY" --prerelease
