name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Build raw Windows package
        run: npm run package:portable:raw

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Create installer and portable package
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'out'
          $raw = Get-ChildItem -LiteralPath $out -Directory -Filter '*-win32-x64' |
            Select-Object -First 1 -ExpandProperty FullName
          $app = Join-Path $out 'SnowRunnerXMLEditor'
          $installer = Join-Path $out 'SnowRunnerXMLEditor.exe'
          $updateInstaller = Join-Path $out 'SnowRunnerXMLEditor_update.exe'
          $portable = Join-Path $out 'SnowRunnerXMLEditor_portable.zip'

          if (-not $raw -or -not (Test-Path -LiteralPath $raw)) {
            throw "Raw package was not created in: $out"
          }

          if (Test-Path -LiteralPath $app) {
            Remove-Item -LiteralPath $app -Recurse -Force
          }

          Move-Item -LiteralPath $raw -Destination $app

          $appExecutable = Join-Path $app 'SnowRunnerXMLEditor.exe'
          if (-not (Test-Path -LiteralPath $appExecutable)) {
            throw "Expected application executable was not found: $appExecutable"
          }

          $isccCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $iscc = $isccCandidates | Select-Object -First 1

          if (-not $iscc) {
            throw 'Inno Setup compiler was not found'
          }

          & $iscc (Join-Path $env:GITHUB_WORKSPACE 'inno-setup\installer.config.iss')
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $installer)) {
            throw 'Installer creation failed'
          }

          Copy-Item -LiteralPath $installer -Destination $updateInstaller -Force
          Compress-Archive -Path (Join-Path $app '*') -DestinationPath $portable -CompressionLevel Optimal

          $assets = @($installer, $updateInstaller, $portable)
          $checksums = $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($_))"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'out'
          $assets = @(
            (Join-Path $out 'SnowRunnerXMLEditor.exe'),
            (Join-Path $out 'SnowRunnerXMLEditor_update.exe'),
            (Join-Path $out 'SnowRunnerXMLEditor_portable.zip'),
            (Join-Path $out 'SHA256SUMS.txt')
          )
          $releaseArgs = @(
            $env:GITHUB_REF_NAME
          ) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY,
            '--title', "SnowRunner XML Editor Next $env:GITHUB_REF_NAME",
            '--generate-notes'
          )
          if ($env:GITHUB_REF_NAME -match '-') {
            $releaseArgs += '--prerelease'
          }
          $null = & gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if ($releaseExists) {
            & gh release upload $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) {
              throw 'GitHub Release asset upload failed'
            }

            $editArgs = @(
              $env:GITHUB_REF_NAME,
              '--repo', $env:GITHUB_REPOSITORY,
              '--title', "SnowRunner XML Editor Next $env:GITHUB_REF_NAME"
            )
            if ($env:GITHUB_REF_NAME -match '-') {
              $editArgs += '--prerelease'
            }
            & gh release edit @editArgs
          } else {
            & gh release create @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release publication failed'
          }
